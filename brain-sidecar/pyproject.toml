[project]
name = "desktop-companion-brain"
version = "0.1.0"
description = "Local-only Python brain sidecar for Desktop Companion"
requires-python = ">=3.11,<3.13"
dependencies = [
  "httpx>=0.27,<1",
  "mem0ai>=1.0,<2",
  "openai>=1.90,<4",
  "qdrant-client>=1.12,<2",
  "graphiti-core>=0.30.1,<0.31",
]

[project.scripts]
desktop-companion-brain = "desktop_companion_brain.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/desktop_companion_brain"]
