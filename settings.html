<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>角色配置</title>
  </head>
  <body class="settings-window">
    <section id="settings-panel" aria-label="角色配置">
      <div class="settings-card" aria-labelledby="settings-title">
        <header class="settings-header">
          <div>
            <p class="settings-eyebrow">CHARACTER SETTINGS</p>
            <h1 id="settings-title">角色配置</h1>
          </div>
        </header>
        <form id="settings-form">
          <fieldset>
            <legend>基础设置</legend>
            <label>
              <span>角色名称</span>
              <input name="displayName" maxlength="32" required autocomplete="off" />
            </label>
            <label>
              <span>显示比例 <output data-scale-output>1.00</output></span>
              <input name="scale" type="range" min="0.75" max="1.25" step="0.05" />
            </label>
            <label class="toggle-row">
              <input name="followCursor" type="checkbox" />
              <span>头部跟随鼠标</span>
            </label>
            <label class="toggle-row">
              <input name="breathing" type="checkbox" />
              <span>呼吸动画（默认关闭）</span>
            </label>
          </fieldset>
          <fieldset class="color-controls">
            <legend>色彩调节</legend>
            <label class="color-control">
              <span class="range-heading">
                <span>暗部环境色</span>
                <output data-value-for="materialAmbientScale">0.25</output>
              </span>
              <input name="materialAmbientScale" data-color-setting type="range" min="0" max="1" step="0.05" />
              <small>越低黑色越深，越高暗部越柔和。</small>
            </label>
            <label class="color-control">
              <span class="range-heading">
                <span>环境补光</span>
                <output data-value-for="hemisphereLightIntensity">0.30</output>
              </span>
              <input name="hemisphereLightIntensity" data-color-setting type="range" min="0" max="2" step="0.05" />
              <small>调节阴影区域的整体明暗。</small>
            </label>
            <label class="color-control">
              <span class="range-heading">
                <span>主光强度</span>
                <output data-value-for="directionalLightIntensity">1.10</output>
              </span>
              <input name="directionalLightIntensity" data-color-setting type="range" min="0" max="4" step="0.05" />
              <small>调节皮肤、头发和衣料的亮部强度。</small>
            </label>
            <div class="color-controls-footer">
              <p class="settings-note">拖动时实时预览；取消会恢复，保存后下次启动继续使用。</p>
              <button type="button" class="color-reset-button" data-reset-colors>恢复推荐色彩</button>
            </div>
          </fieldset>
          <fieldset>
            <legend>API 预设</legend>
            <label>
              <span>Base URL</span>
              <input name="apiBaseUrl" type="url" placeholder="https://api.example.com/v1" autocomplete="off" />
            </label>
            <label>
              <span>模型名称</span>
              <input name="apiModel" placeholder="model-name" autocomplete="off" />
            </label>
            <p class="settings-note">当前仅保存非敏感连接参数；Provider 接入前不会发起请求，API Key 不会在此保存。</p>
          </fieldset>
          <p class="settings-feedback" data-settings-feedback role="status"></p>
          <footer class="settings-actions">
            <button type="button" class="secondary-button" data-settings-close>取消</button>
            <button type="submit" class="primary-button">保存配置</button>
          </footer>
        </form>
      </div>
    </section>
    <script type="module" src="/src/settings-main.ts"></script>
  </body>
</html>
