<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Windows AI 桌面伴侣</title>
  </head>
  <body>
    <canvas id="character-canvas" aria-label="3D 桌面伴侣"></canvas>
    <div id="status" role="status" aria-live="polite">
      <span class="status-dot"></span>
      <span data-status-text>正在唤醒陵光…</span>
    </div>
    <div id="speech-bubble" hidden></div>
    <form id="conversation-panel" hidden aria-label="与桌面助手对话">
      <input
        data-conversation-input
        maxlength="16000"
        autocomplete="off"
        placeholder="输入消息…"
        aria-label="消息"
      />
      <button data-conversation-submit type="submit">发送</button>
    </form>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
